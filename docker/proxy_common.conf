# Shared proxy settings, included from every location block in
# nginx.conf.template that forwards to the jodconverter/Spring Boot app.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Converting large or complex documents can take a while; give the backend
# more room than nginx's 60s proxy defaults.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
